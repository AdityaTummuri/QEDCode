name: Something is wrong
description: QEDCode crashed, gave a wrong grade, or did something unexpected.
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How to make it happen again
      description: The command you ran, and a small repository or receipt if you can share one.
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Output of `qed doctor`
      render: text
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Output of `qed --version`
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [macOS, Linux, Windows, other]
    validations:
      required: true
  - type: markdown
    attributes:
      value: "A wrong grade A is the most important bug there is: please attach the receipt (`.qed/receipts/<task>.json`, or `qed receipt --link`) if the code may be shared. Security problems go through private vulnerability reporting, never here."
