name: Release

# One tag does everything. Pushing a tag like v0.2.0:
#   1. checks the tag against the package version, runs the tests, measures the README stats and
#      regenerates the screenshots (so the PyPI page is current),
#   2. publishes to PyPI with trusted publishing (no API token is stored),
#   3. creates the GitHub Release from that version's CHANGELOG section,
#   4. updates the MCP Registry entry (io.github.AdityaTummuri/qedcode),
#   5. commits the measured stats and fresh screenshots back to main.
# The website rebuilds from the same tag (pages.yml).
#
# One-time setup on PyPI: add a "pending publisher" for the project `qedcode` with this
# repository, the workflow name `release.yml` and the environment `pypi`.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - name: The tag must match the package version
        run: |
          version=$(uv run --no-project python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match version $version in pyproject.toml"; exit 1
          fi
      - name: Run the tests before publishing
        run: |
          uv sync
          git config --global user.email "ci@example.com"
          git config --global user.name "CI"
          uv run ruff check .
          uv run pytest -m "not gpu"
      - name: Release notes come from the CHANGELOG
        run: uv run python scripts/changelog_section.py "$GITHUB_REF_NAME" > release-notes.md
      - name: Measure the README stats and regenerate the screenshots
        run: |
          uv run python scripts/readme_stats.py --version "${GITHUB_REF_NAME#v}"
          uv run python scripts/screenshots.py --out docs/assets
      - name: Build
        run: uv build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: refreshed
          path: |
            README.md
            docs/assets/*.svg
            release-notes.md

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: refreshed
          path: refreshed/
      - name: Create the GitHub Release from the CHANGELOG notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "QEDCode $GITHUB_REF_NAME" \
            --notes-file refreshed/release-notes.md \
            --verify-tag

  mcp-registry:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      MCP_PUBLISHER_VERSION: v1.8.13
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: Download mcp-publisher and verify its signature
        run: |
          set -euo pipefail
          archive="mcp-publisher_linux_amd64.tar.gz"
          base="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl --fail --location --silent --show-error --output "$archive" "$base/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$base/$archive.sigstore.json"
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar xzf "$archive" mcp-publisher
      - name: Publish server.json to the MCP Registry (GitHub OIDC, no stored secret)
        run: |
          version="${GITHUB_REF_NAME#v}"
          jq --arg v "$version" '.version = $v | .packages[].version = $v' server.json > server.tmp
          mv server.tmp server.json
          # PyPI needs a moment before the registry can read the new version's README.
          for attempt in 1 2 3 4 5; do
            ./mcp-publisher login github-oidc && ./mcp-publisher publish && exit 0
            sleep 60
          done
          exit 1

  refresh-main:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: refreshed
          path: refreshed/
      - name: Commit the measured stats and fresh screenshots to main
        run: |
          cp refreshed/README.md README.md
          cp refreshed/docs/assets/*.svg docs/assets/
          if git diff --quiet; then echo "Nothing changed."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Release $GITHUB_REF_NAME: measured stats and fresh screenshots"
          git push origin HEAD:main
