name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 4 * * 1"  # Mondays: also test against the newest allowed dependencies
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - name: Set up Python
        run: uv python install ${{ matrix.python }}
      - name: Install
        run: uv sync --python ${{ matrix.python }}
      - name: Git identity for tests
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "CI"
      - name: Lint
        run: uv run ruff check .
      - name: Format check
        run: uv run ruff format --check .
      - name: Tests
        run: uv run pytest -m "not gpu"
      - name: Engine purity (no UI imports in engine modules)
        if: runner.os == 'Linux'
        run: |
          if grep -rEn "from qedcode\.(tui|cli|mcp_server)|import qedcode\.(tui|cli|mcp_server)|from qedcode import (tui|cli|mcp_server)" \
            src/qedcode/engine src/qedcode/verify src/qedcode/edits src/qedcode/vcs \
            src/qedcode/project src/qedcode/runtime src/qedcode/hardware; then
            echo "Engine modules must not import UI modules"; exit 1
          fi

  newest-dependencies:
    # Upstream breakage turns this red before a user hits it. The lock file is not changed.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - name: Install the newest allowed versions
        run: uv sync --upgrade
      - name: Git identity for tests
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "CI"
      - name: Tests
        run: uv run pytest -m "not gpu"
