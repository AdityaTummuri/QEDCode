name: QEDCode Check

# Dogfood: QEDCode grades its own pull requests with its own action.
on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - name: Install the project (so its tests can run)
        run: |
          uv sync
          git config --global user.email "ci@example.com"
          git config --global user.name "CI"
      - uses: ./
        with:
          version: .  # this checkout, not PyPI: the action checks the code it ships with
          speed: fast
