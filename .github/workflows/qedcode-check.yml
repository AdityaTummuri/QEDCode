name: QEDCode Check

# Dogfood: QEDCode grades its own pull requests with its own action.
on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
      - name: Install the project (so its tests can run)
        run: |
          uv sync
          git config --global user.email "ci@example.com"
          git config --global user.name "CI"
      - uses: ./
        with:
          version: .  # this checkout, not PyPI: the action checks the code it ships with
          speed: fast
