[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "qedcode"
version = "0.1.0"
description = "A local-first coding engine that makes small LLMs reliable: several tries, deterministic checks, one proven fix."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "AdityaTummuri" }]
keywords = ["llm", "coding-agent", "local-llm", "pytest", "mcp", "verification"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Testing",
]

dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "pydantic>=2.14.4",
    "tomli-w>=1.2.0",
    "pyyaml>=6.0.3",
    "psutil>=7.2.2",
    "httpx>=0.28.1",
    "huggingface-hub>=2.4.0",
    "litellm>=1.110.1",
    "keyring>=25.7.0",
    "ruff>=0.17.6",
    "textual>=8.2.8",
    "mcp>=2.3.0",
    "tree-sitter>=0.26.1",
    "tree-sitter-javascript>=0.25.0",
    "tree-sitter-typescript>=0.23.2",
]

[project.scripts]
qed = "qedcode.cli:app"

[project.urls]
Homepage = "https://github.com/AdityaTummuri/QEDCode"
Source = "https://github.com/AdityaTummuri/QEDCode"
Issues = "https://github.com/AdityaTummuri/QEDCode/issues"

[project.optional-dependencies]
nvidia = [
    "nvidia-ml-py>=13.615.71",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[tool.hatch.build.targets.wheel]
packages = ["src/qedcode"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["bugzoo/0*", "docs", "*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["UP042"]  # AGENTS.md specifies (str, Enum) for the shared enums

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "gpu: needs a real GPU and a real local model; skipped in CI, run by hand",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]  # scripted replies and fixtures contain long lines on purpose
"src/qedcode/engine/doctor.py" = ["E501"]  # each fix is one readable sentence
