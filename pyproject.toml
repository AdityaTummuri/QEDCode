[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "qedcode"
version = "0.0.1"
description = "A local-first coding engine that makes small LLMs reliable: several tries, deterministic checks, one proven fix."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "GPL-3.0-or-later" }
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "pydantic>=2.14.4",
    "tomli-w>=1.2.0",
    "pyyaml>=6.0.3",
]

[project.scripts]
qed = "qedcode.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[tool.hatch.build.targets.wheel]
packages = ["src/qedcode"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["bugzoo/0*", "docs", "*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["UP042"]  # AGENTS.md specifies (str, Enum) for the shared enums

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "gpu: needs a real GPU and a real local model; skipped in CI, run by hand",
]
