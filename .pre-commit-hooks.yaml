# pre-commit users: grade every commit before it is made (no model, about the time your tests take).
#   repos:
#     - repo: https://github.com/AdityaTummuri/QEDCode
#       rev: v0.2.0
#       hooks:
#         - id: qedcode-check
- id: qedcode-check
  name: QEDCode check (grade the change)
  description: Grade the staged change A-D with your tests; fail when the tests were changed to look green.
  entry: qed check --speed fast --fail-on-tampered
  language: python
  pass_filenames: false
  always_run: true
  require_serial: true
  stages: [pre-commit]
